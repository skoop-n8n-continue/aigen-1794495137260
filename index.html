<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOY MART - Coming Soon</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="background-container"></div>
    <div class="content">
        <h1 class="logo">
            <span style="color: #FF4136;">T</span>
            <span style="color: #FF851B;">O</span>
            <span style="color: #FFDC00;">Y</span>
            <span>&nbsp;</span>
            <span style="color: #2ECC40;">M</span>
            <span style="color: #0074D9;">A</span>
            <span style="color: #B10DC9;">R</span>
            <span style="color: #FF4136;">T</span>
        </h1>
        <h2 class="coming-soon">COMING SOON</h2>
        <p class="tagline">Get ready for a world of fun and imagination!</p>
        <div class="loading-toys">
            <div class="toy-loader ball"></div>
            <div class="toy-loader block"></div>
            <div class="toy-loader pyramid"></div>
        </div>
    </div>
    <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
